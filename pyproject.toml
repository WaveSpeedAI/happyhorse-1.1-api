[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "happyhorse-1-1-api"
version = "0.1.0"
description = "HappyHorse 1.1 API — Python wrapper for the WaveSpeedAI hosted endpoints"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["wavespeed>=2.0.5"]

[project.urls]
Homepage = "https://wavespeed.ai/happyhorse-1-1-api"
Repository = "https://github.com/WaveSpeedAI/happyhorse-1.1-api"

[tool.setuptools]
py-modules = ["happyhorse_api"]
